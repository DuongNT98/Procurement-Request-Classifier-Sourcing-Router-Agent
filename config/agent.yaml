# Agent Manifest — AgentRegistry entry point
# AgentRegistry (mediator/registry/agent_registry.py) reads every key below at
# ROOT level — do NOT nest keys under an `agent:` block. See the framework's
# AgentRegistry manifest schema documentation for the full contract.
id: "CMN-C2-213"
name: "Procurement Request Classifier & Sourcing Router Agent"
namespace: "cmn"
version: "0.1.0"
enabled: true
category: "Cat 2"
# Static generation contract. ClassifyNode attempts a live Azure OpenAI call
# (design §6 LLM seam) and falls back to the deterministic taxonomy classifier
# on any failure — the deployed generation contract is "llm".
generation_mode: "llm"
industry: "CMN"

# No Level 2 inheritance — inherits the L1 framework (AgentBaseGraph) directly.
# ChatAgent is the reference pattern only (single-turn classify + route).
base_type: "ChatAgent"

# Entry point — single dotted import path (module.Class).
class: "src.graph.graph.Graph"

# Security — CoverageCheckNode reads sensitive supplier/contract data and
# requires VERIFIED_EXTERNAL; callers must present a verified identity.
required_trust_level: "VERIFIED_EXTERNAL"

# Compile-time gates (AgentRegistry._compile_and_cache) — declare every secret/extra
# actually used, or the agent loads with those checks silently disabled.
requires:
  secrets: ["AZURE_OPENAI_API_KEY", "AZURE_OPENAI_ENDPOINT", "AZURE_OPENAI_DEPLOYMENT"]
  extras: ["openai"]  # AzureOpenAIClient wraps langchain_openai.ChatOpenAI
